<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Command GUI · 系统测试证据</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--surface:#162033;--line:#29364b;--muted:#9aacbf;--text:#e8eff8;--pass:#6fe2b0;--fail:#ff9191;--partial:#ffd280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:3px 0 10px}h2{font-size:20px;margin-top:30px}.eyebrow{color:var(--pass);letter-spacing:.15em;font-size:12px}p{color:var(--muted)}a{color:#8ecaff;text-decoration:none}a:hover{text-decoration:underline}code{font-size:12px;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,details,nav,.timeline{background:var(--surface);border:1px solid var(--line);border-radius:12px}.card{padding:15px}.card strong{display:block;font-size:26px}.card span{color:var(--muted);font-size:13px}.PASS{color:var(--pass)}.FAIL,.ERROR{color:var(--fail)}.PARTIAL,.SKIP{color:var(--partial)}.tag{font:700 12px system-ui;padding:4px 9px;border-radius:5px;background:#27334a;display:inline-block}.timeline{padding:18px;margin-top:16px}.barrow{display:grid;grid-template-columns:170px 1fr 80px;gap:12px;align-items:center;margin:8px 0}.track{height:9px;background:#29364b;border-radius:7px;overflow:hidden}.bar{height:100%;background:var(--pass);min-width:3px}.bar.FAIL,.bar.ERROR{background:var(--fail)}.bar.SKIP{background:var(--partial)}nav{padding:16px;margin:24px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:2}input,select{background:var(--bg);color:var(--text);border:1px solid #455774;padding:9px 12px;border-radius:6px;font:inherit}input{flex:1;min-width:180px}details{margin:10px 0;overflow:hidden}summary{cursor:pointer;padding:14px 16px;font-weight:600}.phasebody{padding:0 16px 16px}.phasehead{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.errors{color:var(--fail);white-space:pre-wrap;overflow-wrap:anywhere;background:#271b28;border-radius:6px;padding:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}td pre{white-space:pre-wrap;max-width:640px;overflow-wrap:anywhere}.case-name{font-weight:600}.steps{color:var(--muted);white-space:pre-wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.shot{padding:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.shot img{width:100%;height:150px;object-fit:contain;background:#060a11}.shot div{font-size:11px;overflow-wrap:anywhere}footer{padding-top:30px;color:var(--muted);font-size:12px}.hidden{display:none!important}#metadata{white-space:pre-wrap;overflow:auto;font-size:12px;padding:0 16px 16px}.evidencepath{overflow-wrap:anywhere}.hash{font:10px monospace;color:var(--muted)}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.barrow{grid-template-columns:130px 1fr 60px}main{padding:20px 12px}h1{font-size:24px}nav{position:static}}
</style></head><body><main><div class="eyebrow">COMMAND GUI / SYSTEM VERIFICATION</div><h1>双端流程与边界测试</h1><p id="intro"></p><div class="cards" id="cards"></div><div class="timeline" id="timeline"></div><nav><input id="search" type="search" placeholder="搜索阶段、用例、错误或日志" aria-label="搜索"><select id="filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="issues">失败 / 错误 / 未执行</option><option value="PASS">通过</option></select><a href="report.json">原始 JSON</a><a href="junit.xml">JUnit XML</a></nav><section id="phases"></section><section id="traces"></section><h2>截图证据</h2><p>截图展示实际渲染结果；自动断言覆盖范围以具体用例为准。</p><div id="gallery" class="gallery"></div><h2>完整日志与结果文件</h2><p>日志保持原始内容；SHA-256 用于关联证据。日志中的预期错误注入不会单独认定为产品故障。</p><div class="tablewrap"><table><thead><tr><th>文件</th><th>大小</th><th>SHA-256</th></tr></thead><tbody id="evidence"></tbody></table></div><details><summary>运行环境与覆盖限制</summary><pre id="metadata"></pre></details><footer>此报告可离线打开，全部资源来自同一结果目录。将整个目录一起归档以保留日志与截图链接。</footer></main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n};
const link=(path,label)=>{const a=el('a',label);a.href=path;a.target='_blank';a.rel='noopener';return a};
const statusTag=(status)=>el('span',status,'tag '+status);
document.getElementById('intro').textContent=`运行 ${report.runId} · ${report.started} → ${report.finished} · ${report.status}`;
const cards=[['结果',report.status],['阶段通过',`${report.summary.phasesPassed} / ${report.summary.phases}`],['用例通过',`${report.summary.casesPassed} / ${report.summary.cases}`],['断言',report.summary.assertions],['问题阶段',report.summary.phasesFailed+' / 未执行 '+report.summary.phasesSkipped]];
cards.forEach(([label,value])=>{const c=el('div',undefined,'card');c.append(el('strong',value,label==='结果'?report.status:''),el('span',label));document.getElementById('cards').append(c)});
const maximum=Math.max(1,...report.phases.map(p=>p.durationSeconds||0));
report.phases.forEach(p=>{const row=el('div',undefined,'barrow');const track=el('div',undefined,'track'),bar=el('div',undefined,'bar '+p.status);bar.style.width=Math.max(0,Math.min(100,(p.durationSeconds||0)/maximum*100))+'%';track.append(bar);row.append(el('span',p.id),track,el('span',(p.durationSeconds||0).toFixed(1)+'s'));document.getElementById('timeline').append(row)});
const views=[];
report.phases.forEach(p=>{const d=el('details');d.open=p.status!=='PASS';const sum=el('summary');sum.append(statusTag(p.status),document.createTextNode('  '+p.id+' · '+p.cases.length+' cases / '+p.assertions+' assertions'));d.append(sum);const body=el('div',undefined,'phasebody'),head=el('div',undefined,'phasehead');head.append(el('span','Exit: '+(p.processExitCode??'n/a')),el('span','Duration: '+(p.durationSeconds||0).toFixed(3)+'s'),el('span','Timeout: '+p.timedOut),el('span',p.started||''));body.append(head);if(p.errors.length)body.append(el('pre',p.errors.join('\n'),'errors'));
 const phaseFiles=report.evidence.filter(e=>e.path.startsWith(p.id+'/')&&e.type!=='image');const logs=el('p');phaseFiles.filter(e=>e.type==='log'||e.path.endsWith('/report.json')).forEach(e=>{logs.append(link(e.url,e.path.slice(p.id.length+1)),document.createTextNode(' · '))});body.append(logs);
 const wrap=el('div',undefined,'tablewrap'),table=el('table'),thead=el('thead'),hr=el('tr');['状态','用例 / 步骤','耗时','错误'].forEach(t=>hr.append(el('th',t)));thead.append(hr);table.append(thead);const tb=el('tbody'),rows=[];
 p.cases.forEach(c=>{const tr=el('tr'),st=el('td');st.append(statusTag(c.status));const name=el('td');name.append(el('div',c.group+'/'+c.name,'case-name'));if(c.steps?.length)name.append(el('pre',c.steps.map(s=>typeof s==='string'?s:JSON.stringify(s,null,2)).join('\n'),'steps'));const err=el('td');if(c.error)err.append(el('pre',c.error));tr.append(st,name,el('td',c.milliseconds+' ms'),err);tb.append(tr);rows.push({node:tr,status:c.status,text:JSON.stringify(c).toLowerCase()})});table.append(tb);wrap.append(table);body.append(wrap);d.append(body);document.getElementById('phases').append(d);views.push({node:d,phase:p,rows,text:JSON.stringify(p).toLowerCase()});
});
const evidenceRows=[];report.evidence.forEach(e=>{const row=el('tr'),cell=el('td',undefined,'evidencepath');cell.append(link(e.url,e.path));row.append(cell,el('td',e.bytes.toLocaleString()+' B'),el('td',e.sha256,'hash'));document.getElementById('evidence').append(row);evidenceRows.push({node:row,text:e.path.toLowerCase()});if(e.type==='image'){const box=el('div',undefined,'shot'),a=link(e.url,'');const img=el('img');img.src=e.url;img.alt=e.path;img.loading='lazy';a.append(img);box.append(a,el('div',e.path));document.getElementById('gallery').append(box)}});
if(!report.evidence.some(e=>e.type==='image'))document.getElementById('gallery').append(el('p','本次运行没有截图，查看阶段错误与日志。'));
document.getElementById('metadata').textContent=JSON.stringify({environment:report.environment,inputs:report.inputs,coverage:report.coverage,limitations:report.limitations},null,2);
// Event summaries are bounded; full payloads remain in the linked original JSONL.
const trace=report.traceAnalysis,traceRoot=document.getElementById('traces');
if(trace){
 traceRoot.append(el('h2','双端数据包与事件时间线'));
 const note=el('p');note.append(statusTag(trace.status),document.createTextNode(`  ${trace.files} 个进程日志 · ${trace.parsedLines} / ${trace.lines} 行可解析 · ${trace.issues.length} 项完整性问题 · ${trace.failureEventCount} 个失败事件`));traceRoot.append(note);
 traceRoot.append(el('p','记录全部 command-gui 自定义数据包与测试事件；不包含每一个原版 Minecraft TCP 包。每个进程校验 seq 连续及单调时间，跨进程时间线按 UTC 展示。'));
 const createTable=(heads,rows)=>{const wrap=el('div',undefined,'tablewrap'),table=el('table'),thead=el('thead'),tr=el('tr');heads.forEach(h=>tr.append(el('th',h)));thead.append(tr);table.append(thead);const body=el('tbody');rows.forEach(r=>body.append(r));table.append(body);wrap.append(table);return wrap};
 traceRoot.append(createTable(['角色','事件行','数据包','失败事件','日志问题','原始日志'],trace.roles.map(r=>{const tr=el('tr'),a=el('td');a.append(link(r.url,r.path));tr.append(el('td',r.role),el('td',r.lines),el('td',r.packets),el('td',r.failures,r.failures?'FAIL':''),el('td',r.issues,r.issues?'ERROR':''),a);return tr})));
 if(trace.issues.length){const d=el('details');d.open=true;d.append(el('summary','日志完整性问题 · '+trace.issues.length));const b=el('div',undefined,'phasebody');trace.issues.forEach(i=>{const p=el('p',undefined,'ERROR');p.append(document.createTextNode(`${i.role} · 行 ${i.line} · ${i.code}: ${i.message} `),link(i.url,'打开原始日志'));b.append(p)});d.append(b);traceRoot.append(d)}
 if(trace.failureEventCount){const d=el('details');d.open=true;d.append(el('summary',`失败事件 · 显示 ${trace.failureEvents.length} / ${trace.failureEventCount}`));const b=el('div',undefined,'phasebody');trace.failureEvents.forEach(e=>{const p=el('p',undefined,'FAIL');p.append(document.createTextNode(`${e.utc} · ${e.role} #${e.seq} · ${e.event} `),link(e.url,'原始行 '+e.line));b.append(p,el('pre',e.summary,'errors'))});d.append(b);traceRoot.append(d)}
 const controls=el('div',undefined,'phasehead');controls.style.marginTop='18px';const q=el('input');q.type='search';q.placeholder='搜索数据包类型、事件、命令或错误';q.setAttribute('aria-label','搜索事件');const role=el('select');role.setAttribute('aria-label','事件角色');['all','server','ActorA','ActorB'].forEach(v=>{const o=el('option',v==='all'?'全部角色':v);o.value=v;role.append(o)});controls.append(q,role);traceRoot.append(controls);
 const packetRows=trace.packetStats.map(p=>{const tr=el('tr');tr.append(el('td',p.role),el('td',p.direction),el('td',p.payload),el('td',p.count),el('td',p.tcp),el('td',p.memory));return {node:tr,role:p.role,text:JSON.stringify(p).toLowerCase()}});traceRoot.append(el('h3','数据包统计'),createTable(['角色','方向','Payload 类型','总数','TCP','内存连接'],packetRows.map(r=>r.node)));
 const timeline=el('details');timeline.open=trace.failureEventCount>0;timeline.append(el('summary',`关键事件时间线 · ${trace.timeline.length} / ${trace.keyEventCount}（省略 ${trace.timelineOmitted}，全量见日志）`));
 const eventRows=trace.timeline.map(e=>{const tr=el('tr'),detail=el('td'),source=el('td');detail.append(el('pre',e.summary));source.append(link(e.url,'第 '+e.line+' 行'));tr.append(el('td',e.utc),el('td',e.role+' #'+e.seq),el('td',e.event,e.failed?'FAIL':''),detail,source);return {node:tr,role:e.role,text:JSON.stringify(e).toLowerCase()}});timeline.append(createTable(['UTC','角色 / 序号','事件','内容摘要','完整证据'],eventRows.map(r=>r.node)));traceRoot.append(timeline);
 const filterTrace=()=>{const value=q.value.toLowerCase();[...packetRows,...eventRows].forEach(r=>r.node.classList.toggle('hidden',(role.value!=='all'&&role.value!==r.role)||(!!value&&!r.text.includes(value))));if(value)timeline.open=true};q.addEventListener('input',filterTrace);role.addEventListener('change',filterTrace);
}
function filter(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const statusOk=s=>f==='all'||(f==='issues'?s!=='PASS':s==='PASS');views.forEach(v=>{let shown=0;v.rows.forEach(r=>{const yes=statusOk(r.status)&&(!q||r.text.includes(q)||v.phase.id.includes(q));r.node.classList.toggle('hidden',!yes);if(yes)shown++});const visible=shown>0||(statusOk(v.phase.status)&&(!q||v.text.includes(q)));v.node.classList.toggle('hidden',!visible);if(q||f!=='all')v.node.open=visible});evidenceRows.forEach(e=>e.node.classList.toggle('hidden',!!q&&!e.text.includes(q)))}document.getElementById('search').addEventListener('input',filter);document.getElementById('filter').addEventListener('change',filter);
</script></body></html>
