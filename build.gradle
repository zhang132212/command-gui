plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"easy-cmd" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArg "-Ddevauth.enabled=true"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu support (optional)
	compileOnly "com.terraformersmc:modmenu:20.0.1"

	runtimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
	main {
		java {
			srcDir 'server/src/main/java'
		}
	}
}


jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Automatically bump mod version after each successful build.
tasks.register("bumpVersion") {
    doLast {
        if (tasks.build.state.upToDate) {
            println "Build was up-to-date, skip version bump"
            return
        }

        def propsFile = file("gradle.properties")
        def text = propsFile.getText("UTF-8")
        def matcher = text =~ /mod_version=0\.2\.0-beta\.(\d+)/
        if (matcher.find()) {
            def nextVersion = Integer.parseInt(matcher.group(1)) + 1
            def updated = text.replaceFirst(/mod_version=0\.2\.0-beta\.(\d+)/, "mod_version=0.2.0-beta.${nextVersion}")
            propsFile.setText(updated, "UTF-8")
            println "Version auto-bumped to 0.2.0-beta.${nextVersion} for the next build"
        }
    }
}

build.finalizedBy bumpVersion
